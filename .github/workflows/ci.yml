name: CI/CD backend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./tests/...

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            docker stop hotel-booking-backend || true
            docker rm hotel-booking-backend || true

            SECRET=$(aws secretsmanager get-secret-value \
              --secret-id "hotel-booking/db-credentials" \
              --region ${{ secrets.AWS_REGION }} \
              --query SecretString \
              --output text)

            DB_HOST=$(echo $SECRET | jq -r '.DB_HOST')
            DB_USER=$(echo $SECRET | jq -r '.DB_USER')
            DB_PASSWORD=$(echo $SECRET | jq -r '.DB_PASSWORD')
            DB_NAME=$(echo $SECRET | jq -r '.DB_NAME')
            IMAGE="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest"

            docker run -d --restart always --name hotel-booking-backend -p 80:8080 \
              --log-driver awslogs \
              --log-opt awslogs-region=${{ secrets.AWS_REGION }} \
              --log-opt awslogs-group=/hotel-booking/backend \
              --log-opt awslogs-stream=ec2 \
              -e DB_HOST="$DB_HOST" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_NAME="$DB_NAME" \
              "$IMAGE"


            sleep 5

            STATUS=$(docker inspect -f '{{.State.Status}}' hotel-booking-backend)
            if [ "$STATUS" != "running" ]; then
              echo "Container failed to start. Status: $STATUS"
              docker logs hotel-booking-backend
              exit 1
            fi

            echo "Deployment successful. Container is running."
